server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Healthcheck Endpoint for Google Cloud Run
    location = /healthz {
        access_log off;
        return 200 "OK\n";
    }

    # Serve CITATION.cff and .tex files as clean UTF-8 plain text
    location ~* \.(cff|tex)$ {
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "public, no-transform";
    }

    # Static Assets Caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Academic Papers Directory (Strict file resolution, never fallback to /index.html on 404)
    location /papers/ {
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Main Platform SPA Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Error Pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
