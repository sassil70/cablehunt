<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="100%" height="100%" style="background:#ffffff;font-family:'Times New Roman',serif;">
      <rect x="0" y="0" width="760" height="300" fill="#ffffff"/>
      <text x="380.0" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">Fig. 2. Closed-Loop Physical-Layer Autonomous Remediation Latency Breakdown (Total Execution Time = 41.8 ms &lt; 50 ms ITU-T G.8032)</text>
      <!-- Timeline Bar Chart -->
      <rect x="65" y="42" width="650" height="190" fill="#fafafa" stroke="#333" stroke-width="1.2"/>
      <!-- Vertical grid lines at 0, 10, 20, 30, 40, 50 ms -->
      <line x1="65.0" y1="42" x2="65.0" y2="232" stroke="#ddd" stroke-dasharray="3,3"/><text x="65.0" y="250" text-anchor="middle" font-size="11">0 ms</text><line x1="180.0" y1="42" x2="180.0" y2="232" stroke="#ddd" stroke-dasharray="3,3"/><text x="180.0" y="250" text-anchor="middle" font-size="11">10 ms</text><line x1="295.0" y1="42" x2="295.0" y2="232" stroke="#ddd" stroke-dasharray="3,3"/><text x="295.0" y="250" text-anchor="middle" font-size="11">20 ms</text><line x1="410.0" y1="42" x2="410.0" y2="232" stroke="#ddd" stroke-dasharray="3,3"/><text x="410.0" y="250" text-anchor="middle" font-size="11">30 ms</text><line x1="525.0" y1="42" x2="525.0" y2="232" stroke="#ddd" stroke-dasharray="3,3"/><text x="525.0" y="250" text-anchor="middle" font-size="11">40 ms</text><line x1="640.0" y1="42" x2="640.0" y2="232" stroke="#ddd" stroke-dasharray="3,3"/><text x="640.0" y="250" text-anchor="middle" font-size="11">50 ms</text>
      <!-- Red 50ms SLA Threshold Line -->
      <line x1="640.0" y1="42" x2="640.0" y2="232" stroke="#cc0000" stroke-width="2" stroke-dasharray="5,3"/>
      <text x="646.0" y="62" font-size="10.5" font-weight="bold" fill="#cc0000">50.0 ms Carrier</text>
      <text x="646.0" y="75" font-size="10.5" font-weight="bold" fill="#cc0000">Protection SLA</text>

      <!-- Stage 1: CH4 RX_LOS Hardware Edge Trigger & DMA Capture (0 - 3.2 ms) -->
      <rect x="65" y="58" width="37" height="26" fill="#0052cc" rx="3"/>
      <text x="110" y="75" font-size="11" font-weight="bold" fill="#111">[T1: 0.0–3.2 ms] CH4 RX_LOS Hardware Latch + 1.25 GSa/s 12-Bit DMA Waveform Ingestion</text>

      <!-- Stage 2: Quantitative DSP Feature Extraction (3.2 - 11.6 ms) -->
      <rect x="102" y="96" width="97" height="26" fill="#008080" rx="3"/>
      <text x="207" y="113" font-size="11" font-weight="bold" fill="#111">[T2: 3.2–11.6 ms] DSP Extraction (Vpp, Optical Sag %, tr/tf, RMS Jitter, I2C SFF-8472 DDM)</text>

      <!-- Stage 3: Hybrid 1D-CNN + Transformer Inference (11.6 - 24.1 ms) -->
      <rect x="199" y="134" width="144" height="26" fill="#d97706" rx="3"/>
      <text x="351" y="151" font-size="11" font-weight="bold" fill="#111">[T3: 11.6–24.1 ms] Hybrid 1D-CNN + Transformer Fault Classification &amp; L-BFGS-B Spectral Solver</text>

      <!-- Stage 4: Pre-warmed SSH/Netmiko Switch CLI Injection (24.1 - 41.8 ms) -->
      <rect x="343" y="172" width="203" height="26" fill="#16a34a" rx="3"/>
      <text x="553" y="189" font-size="11" font-weight="bold" fill="#065f46">[T4: 24.1–41.8 ms] Cisco IOS / RouterOS Transceiver Power &amp; λ-Shift Commit</text>

      <text x="390" y="278" text-anchor="middle" font-size="12" font-weight="bold">Elapsed Remediation Time (ms) — Measured on Birmingham Testbed (Cisco IE-3000-8FM + Rigol DHO804)</text>
    </svg>